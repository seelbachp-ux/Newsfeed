name: Daily Digest

# Research now happens in a scheduled Claude routine (see ROUTINE.md). It
# pushes digests/<date>/*.md, and that push triggers this delivery job:
# Telegram + Piper podcast episode + RSS feed. No API key needed here anymore.
on:
  push:
    paths: ["digests/**"]       # any branch — the routine may push to claude/*
  schedule:
    # Watchdog, ~3h after the routine's slot (06:00 UTC). Delivers anything
    # still pending and alerts on Telegram if today's digest never arrived.
    # Odd minute: GitHub's free scheduler drops fewer runs off the hour.
    - cron: "17 9 * * 1-5"
  workflow_dispatch:            # "Run workflow" button: delivers anything pending

permissions:
  contents: write

concurrency: digest             # never deliver the same digest twice in parallel

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Bring in the digest if the routine pushed to a side branch
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        run: |
          git fetch --depth=1 origin ${{ github.sha }}
          git checkout FETCH_HEAD -- digests

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Install audio tools (ffmpeg + Piper TTS)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install piper-tts

      - name: Download Piper voice model
        run: |
          mkdir -p voice
          base=https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium
          curl -sL -o voice/en_US-lessac-medium.onnx       "$base/en_US-lessac-medium.onnx"
          curl -sL -o voice/en_US-lessac-medium.onnx.json  "$base/en_US-lessac-medium.onnx.json"

      - name: Send Telegram, render podcast
        run: python run_cloud.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PIPER_MODEL: voice/en_US-lessac-medium.onnx
          FEED_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          WATCHDOG: ${{ github.event_name == 'schedule' }}

      - name: Commit episode + feed
        if: always()            # keep the episodes even if the watchdog alerted
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs digests
          git commit -m "Episode $(date +%F)" || echo "nothing to commit"
          git push
